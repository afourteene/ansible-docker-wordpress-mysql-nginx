- name: Create db directory if it does not exist
  file:
    path: "/home/{{ ansible_user }}/db"
    state: directory


- name: create template compose file to db directory
  template:
    src: ../templates/db_compose.j2
    dest: "/home/{{ ansible_user }}/db/docker-compose.yml"

- name: Check docker compose status
  community.docker.docker_compose_v2:
    project_src: "/home/{{ ansible_user }}/db"
    state: present
    recreate: always   
  register: compose_info

- name: check status of my container
  debug:
    var: compose_info
