---
- name: Deploy WordPress and MySQL on server2
  hosts: mysqlAndWordpress
  become: true
  vars:
    mysql_root_password: "test123"
    wordpress_db_name: "wordpress"
    wordpress_db_user: "user"
    wordpress_db_password: "wppass123"

  tasks:
    - name: Create Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
      loop:
        - mysql_data
        - wordpress_data

    - name: Create Docker network
      community.docker.docker_network:
        name: wordpress_network

    - name: Run MySQL container
      community.docker.docker_container:
        name: mysql_db
        image: mysql:latest
        restart_policy: always
        env:
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
          MYSQL_DATABASE: "{{ wordpress_db_name }}"
          MYSQL_USER: "{{ wordpress_db_user }}"
          MYSQL_PASSWORD: "{{ wordpress_db_password }}"
        volumes:
          - mysql_data:/var/lib/mysql
        ports:
          - "3306:3306"
        networks:
          - name: wordpress_network
        state: started

    - name: Run WordPress container
      community.docker.docker_container:
        name: wordpress_app
        image: wordpress:latest
        restart_policy: always
        env:
          WORDPRESS_DB_HOST: "mysql_db:3306"
          WORDPRESS_DB_USER: "{{ wordpress_db_user }}"
          WORDPRESS_DB_PASSWORD: "{{ wordpress_db_password }}"
          WORDPRESS_DB_NAME: "{{ wordpress_db_name }}"
        ports:
          - "8080:80"
        volumes:
          - wordpress_data:/var/www/html
        networks:
          - name: wordpress_network
        state: started
        
- name: Deploy Nginx as reverse proxy
  hosts: nginx
  become: true
  vars:
    nginx_conf_content: |
      upstream wordpress_backend {
          server {{ hostvars[groups['mysqlAndWordpress'][0]]['ansible_host'] }}:8080;
          server {{ hostvars[groups['server1'][0]]['ansible_host'] }}:8081;
      }
      
      server {
          listen 80;
          server_name _;
          
          location / {
              proxy_pass http://wordpress_backend;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

  tasks:
    - name: Create nginx config directory
      file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'

    - name: Create nginx configuration file
      copy:
        content: "{{ nginx_conf_content }}"
        dest: /tmp/nginx.conf
        mode: '0644'

    - name: Run Nginx container
      community.docker.docker_container:
        name: nginx_proxy
        image: nginx:latest
        restart_policy: always
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - /tmp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        state: started
